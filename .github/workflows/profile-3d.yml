name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    steps:
      - uses: actions/checkout@v3

      - name: Write settings.json
        run: |
          mkdir -p profile-3d-contrib
          cat > profile-3d-contrib/settings.json << 'EOL'
          {
            "type": "rainbow",
            "backgroundColor": "#0d1117",
            "foregroundColor": "#dddddd",
            "strongColor": "#ffffff",
            "weakColor": "#888888",
            "radarColor": "#FFD700",
            "growingAnimation": true,
            "contribColors": [
              "#1a1a1a",
              "#5C4400",
              "#997F00",
              "#FFD700",
              "#FFA500"
            ]
          }
          EOL

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- profile-3d-contrib/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update 3D contribution graph"
          git push origin HEAD:main
